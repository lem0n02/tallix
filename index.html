<!doctype html>
<html lang="en" class="dark" style="color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tallix - Financial Engine</title>
    <meta name="description" content="Production-grade expense management application for personal and group expenses, transactions, settlements, and analytics." />
    <meta name="theme-color" content="#09090b" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/jpg" href="/src/assets/images/tallix_brand_app_logo_1785406274692.jpg" />
    <link rel="apple-touch-icon" href="/src/assets/images/tallix_brand_app_logo_1785406274692.jpg" />
    <script>
      try {
        localStorage.removeItem('tallix_theme');
      } catch (e) {}
      if (typeof window !== 'undefined' && 'serviceWorker' in navigator) {
        if (location.hostname === 'localhost' || location.hostname.includes('run.app')) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var i = 0; i < regs.length; i++) {
              regs[i].unregister();
            }
          }).catch(function() {});
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              for (var j = 0; j < keys.length; j++) {
                caches.delete(keys[j]);
              }
            }).catch(function() {});
          }
        }
      }
    </script>
  </head>
  <body class="bg-[#09090b] text-[#fafafa] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
