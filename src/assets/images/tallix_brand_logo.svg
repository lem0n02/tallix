<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Top Crossbar Gradient: Vivid electric cyan-blue to royal blue -->
    <linearGradient id="tCrossbar" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#0088ff" />
      <stop offset="28%" stop-color="#0066ff" />
      <stop offset="100%" stop-color="#004ce6" />
    </linearGradient>

    <!-- Main Stem Surface: Illuminated royal blue tapering to cobalt -->
    <linearGradient id="tStem" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#0077ff" />
      <stop offset="40%" stop-color="#005cf6" />
      <stop offset="85%" stop-color="#0044e6" />
      <stop offset="100%" stop-color="#0038cc" />
    </linearGradient>

    <!-- Fold Crease / Underside Shadow for 3D ribbon effect -->
    <linearGradient id="tFold" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#0033aa" />
      <stop offset="65%" stop-color="#002488" />
      <stop offset="100%" stop-color="#001866" />
    </linearGradient>

    <!-- Coin Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066ff" />
      <stop offset="100%" stop-color="#003ecc" />
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Main Emblem Group -->
  <g id="emblem" transform="translate(14, 10)">
    <!-- 1. Back Document (Angled ~+8 deg clockwise) -->
    <g transform="translate(338, 292) rotate(8)">
      <rect x="-46" y="-72" width="92" height="144" rx="10" fill="#ffffff" stroke="#0052ff" stroke-width="12" stroke-linejoin="round" />
    </g>

    <!-- 2. Front Document (Angled ~-5 deg counter-clockwise) -->
    <g transform="translate(312, 314) rotate(-5)">
      <rect x="-50" y="-76" width="100" height="152" rx="10" fill="#ffffff" stroke="#0052ff" stroke-width="12" stroke-linejoin="round" />
      <!-- 3 Horizontal Ledger Lines -->
      <line x1="-28" y1="-28" x2="24" y2="-28" stroke="#0052ff" stroke-width="10" stroke-linecap="round" />
      <line x1="-28" y1="0" x2="14" y2="0" stroke="#0052ff" stroke-width="10" stroke-linecap="round" />
      <line x1="-28" y1="28" x2="4" y2="28" stroke="#0052ff" stroke-width="10" stroke-linecap="round" />
    </g>

    <!-- 3. Ribbon Fold Shadow (Right side of stem intersection) -->
    <path d="M 205 178 C 224 178 248 198 254 228 C 260 258 256 288 250 315 L 214 295 C 219 250 219 214 205 178 Z"
          fill="url(#tFold)" />

    <!-- 4. Stem of the 'T' -->
    <path d="M 160 178 C 205 178 250 208 254 262 C 258 318 250 378 230 435 C 216 472 195 498 175 502 C 165 504 157 496 158 484 C 160 466 171 432 179 392 C 194 318 198 258 186 215 C 179 192 170 183 160 178 Z"
          fill="url(#tStem)" />

    <!-- 5. Crossbar of the 'T' -->
    <path d="M 105 178 L 160 108 L 412 108 L 382 178 Z" fill="url(#tCrossbar)" />

    <!-- 6. Coin Badge (Bengali Taka ৳) at bottom-right of front document -->
    <g transform="translate(366, 392)">
      <circle cx="0" cy="0" r="34" fill="url(#badgeGrad)" stroke="#ffffff" stroke-width="3" />
      <!-- Accurate Taka Symbol (৳) in white -->
      <g fill="#ffffff" transform="translate(-1, 0) scale(0.68)">
        <path d="M -18 -18 L 18 -18 C 20 -18 22 -16 22 -14 C 22 -12 20 -10 18 -10 L 2 -10 L 2 0 C 6 -3 10 -4 15 -4 C 24 -4 30 2 30 11 C 30 21 22 28 12 28 C 5 28 0 23 -3 18 L -3 23 C -3 25 -5 27 -7 27 C -9 27 -11 25 -11 23 L -11 -10 L -18 -10 C -20 -10 -22 -12 -22 -14 C -22 -16 -20 -18 -18 -18 Z M -3 2 L -3 12 C 0 16 5 20 11 20 C 16 20 21 16 21 11 C 21 6 17 3 12 3 C 7 3 2 5 0 8 L -3 7 Z" />
      </g>
    </g>
  </g>
</svg>